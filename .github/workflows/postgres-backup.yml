name: PostgreSQL backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create encrypted-in-transit database dump
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pg_dump --format=custom --no-owner --no-privileges --file=vabbot.dump "$DIRECT_URL"
      - name: Upload to private R2 backup bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: node scripts/upload-backup.mjs vabbot.dump
      - name: Remove local dump
        if: always()
        run: rm -f vabbot.dump
